name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Backend: pytest
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rmmdb_test
          POSTGRES_USER: rmm_app
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://rmm_app:testpass@localhost:5432/rmmdb_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_SECRET_KEY: ci-test-jwt-secret-key-not-for-production
      FLASK_ENV: testing
      SUPERADMIN_EMAIL: superadmin@test.local
      SUPERADMIN_PASSWORD: TestSuperAdmin@1
      ORG_REGISTRATION_TOKEN: ci-test-token
      AI_ASSISTANT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements.txt pytest pytest-flask pytest-cov ruff pip-audit

      - name: Lint (ruff)
        working-directory: api
        # Baseline rule set only (see api/ruff.toml) — E4/E7/E9/F. A real run still
        # surfaces ~122 pre-existing findings across the codebase (mostly unused
        # imports and E402 module-import-not-at-top), which is out of scope to fix
        # in an infra-focused pass. continue-on-error so this doesn't block the
        # pipeline yet; tighten/fix incrementally and remove this once clean.
        run: ruff check .
        continue-on-error: true

      - name: Dependency vulnerability scan (pip-audit)
        # audits/security_audit.md Finding D1 — the backlog this comment used to
        # describe (49 known vulnerabilities: flask, flask-cors, marshmallow,
        # python-dotenv, requests, pillow, pyasn1) is fixed; this step now
        # actually enforces (no more continue-on-error). The one deliberate
        # exception: pyasn1 stays pinned <0.5.0 because pysnmp==4.4.12 (used by
        # tasks/snmp_tasks.py's classic synchronous hlapi API) cannot import at
        # all against pyasn1>=0.5 (confirmed by direct test — ModuleNotFoundError:
        # pyasn1.compat.octets). Fixing that needs a real rewrite of
        # snmp_tasks.py onto pysnmp 5.x/7.x's async API, not a version bump —
        # tracked, not silently ignored. --ignore-vuln only covers pyasn1's 4
        # known advisories; any new one, or a vulnerability anywhere else,
        # fails the build.
        #
        # agent/requirements.txt is deliberately NOT audited here — pip-audit
        # has to actually resolve/install each package to scan it, and that
        # file pins pywin32 (no Linux wheel at all), so running it on this
        # ubuntu-latest runner always fails with "no matching distribution"
        # regardless of any real vulnerability. It's audited instead from the
        # windows-latest test-agent job below, where pywin32 can install.
        run: |
          pip-audit -r api/requirements.txt \
            --ignore-vuln PYSEC-2026-2263 --ignore-vuln PYSEC-2026-3455 \
            --ignore-vuln PYSEC-2026-3456 --ignore-vuln PYSEC-2026-3457
          pip-audit -r dashboard/requirements.txt

      - name: Run database migrations
        working-directory: api
        run: flask --app app:create_app db upgrade
        env:
          FLASK_ENV: development

      - name: Run tests with coverage
        working-directory: api
        run: |
          pytest tests/ -v \
            --cov=. \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70 \
            --tb=short

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: api/coverage.xml
          fail_ci_if_error: false

  # Dashboard: pytest (Streamlit dashboard/utils, pure-Python deps)
  test-dashboard:
    name: Dashboard Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt

      - name: Install dependencies
        working-directory: dashboard
        run: pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: dashboard
        run: pytest tests/ -v

  # Agent: pytest (pywin32/wmi in requirements.txt have no platform markers and
  # have no Linux wheel, so this must run on Windows — matches CLAUDE.md's Windows-
  # first agent environment anyway. The tests themselves are pure logic (string/byte
  # decoding, command-string building) and never call the Windows-only APIs.)
  test-agent:
    name: Agent Tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        working-directory: agent
        run: pip install -r requirements.txt pytest pip-audit

      - name: Dependency vulnerability scan (pip-audit)
        # Moved here from test-backend — this file pins pywin32, which has no
        # Linux wheel, so it can only be resolved/audited on this Windows runner.
        working-directory: agent
        run: pip-audit -r requirements.txt

      - name: Run tests
        working-directory: agent
        run: pytest tests/ -v

  # Frontend: TypeScript build
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Dependency vulnerability scan (npm audit)
        working-directory: frontend
        # audits/security_audit.md Finding D1 — the 6 pre-existing vulnerabilities
        # this comment used to describe (4 high: browserslist, nanoid, react-router/
        # react-router-dom; 2 moderate) were all fixed by `npm audit fix` (no
        # --force, no major bumps — patch-level within existing package.json
        # ranges, verified with the full test/build/E2E suite). Now enforced.
        run: npm audit --audit-level=high

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: /api

  # Docker: nginx multi-stage build (main branch only)
  build-docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Build nginx image
        run: |
          docker build \
            --file nginx/Dockerfile \
            --build-arg VITE_API_URL=/api \
            --tag rmm-nginx:ci \
            .
